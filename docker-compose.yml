# Развёртывание на сервере.
#
#   docker compose up -d --build
#
# Приложение публикуется на всех адресах сервера, порт 80: сайт открывают
# по IP, отдельного обратного прокси нет. Статику раздаёт само приложение
# (whitenoise), так что nginx для этого не нужен.
#
# Если позже появится домен и https, поставьте перед приложением nginx,
# верните публикацию на 127.0.0.1 (WEB_BIND в .env) и включите
# DJANGO_BEHIND_PROXY=True — см. README, «Обратный прокси».
#
# База по умолчанию поднимается рядом, в своём контейнере: за это отвечает
# docker-compose.postgres.yml, подключённый через COMPOSE_FILE в .env.

services:
  web:
    build:
      context: .
      args:
        # слой рендера STEP (см. Dockerfile); образ общий с worker
        WITH_STEP: ${WITH_STEP:-false}
    image: oy-components:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # задано здесь, а не в .env: в контейнере отладочный режим не включают
      # ни при каких обстоятельствах — он показывает настройки и трассировки
      DJANGO_DEBUG: "False"
      DJANGO_CACHE_URL: "redis://redis:6379/0"
      DJANGO_MEDIA_ROOT: "/srv/media"
      DJANGO_STEP_QUEUE_DIR: "/srv/step_queue"
    ports:
      # WEB_BIND=127.0.0.1 — если впереди появится прокси на хосте
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:8000"
    volumes:
      # Изображения плат. Томом, а не каталогом в образе: всё, что лежит в
      # образе, исчезает при пересборке. Каталог должен попадать в
      # резервную копию наравне с базой — в базе от них только путь.
      - media:/srv/media
      # STEP-модели в ожидании рендера: веб-процесс кладёт, воркер забирает.
      # Файлы живут секунды, в резервную копию каталог не нужен
      - step_queue:/srv/step_queue
    depends_on:
      redis:
        condition: service_healthy
    # если база работает на самом сервере, но вне Docker, в .env указывают
    # POSTGRES_HOST=host.docker.internal и раскомментируют строки ниже
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # Фоновый рендер картинок посадочных мест. Тот же образ, другая
  # команда: берёт заявки из базы и рисует их, пока сайт отвечает.
  #
  # Сервис не запускается, пока его не попросили: он нужен только с
  # бэкендом задач в базе, а по умолчанию бэкенд встроенный — сайт тогда
  # запускает рендер отдельным процессом сам. Без этого условия воркер
  # падал бы на старте («Unknown command: db_worker» — команда приходит
  # вместе с django_tasks_db, а тот подключается только с этим бэкендом)
  # и перезапускался бы бесконечно. Включить — две строки в .env:
  #
  #   DJANGO_TASKS_BACKEND=django_tasks_db.DatabaseBackend
  #   COMPOSE_PROFILES=worker
  #
  # Миграции он не запускает: их накатывает web, и двум процессам делать
  # это одновременно незачем.
  worker:
    profiles: ["worker"]
    image: oy-components:latest
    restart: unless-stopped
    # Экран для VTK воркер поднимает сам, при первом рендере
    # (components/step.py, ensure_display) — обёртка тут не нужна
    command: ["python", "manage.py", "db_worker"]
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_CACHE_URL: "redis://redis:6379/0"
      DJANGO_MEDIA_ROOT: "/srv/media"
      DJANGO_STEP_QUEUE_DIR: "/srv/step_queue"
      DJANGO_MIGRATE_ON_START: "false"
    volumes:
      # тот же каталог изображений, что у web: картинку пишет воркер
      - media:/srv/media
      - step_queue:/srv/step_queue
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    # OpenCascade на битом файле способен уронить процесс целиком, а не
    # выбросить исключение; restart поднимет воркер снова
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # общий кэш для всех работников gunicorn: без него сброс после правки
    # доходит только до того работника, который её принял (см. README)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  media:
  step_queue:
